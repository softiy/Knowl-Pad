[package]
name = "kp-domain"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = "2.0.21"
# Windows 路径规范化：去除 \\?\ 前缀的可读形式（技术方案 §3.5.2 / NFR-PLAT-10）
dunce = "1.0.5"

[dev-dependencies]
tempfile = "3.27.0"
# 仅测试用：读取附录 B 的结构化夹具（tests/fixtures/syntax-compat/expected.json）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
