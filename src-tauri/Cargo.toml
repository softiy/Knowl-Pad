[package]
name = "knowl-pad"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "跨平台本地优先笔记与知识管理软件"
license = "MIT OR Apache-2.0"

[lib]
name = "knowl_pad"
path = "src/lib.rs"

[[bin]]
name = "knowl-pad"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
kp-domain = { path = "../crates/kp-domain" }
tauri = { version = "2.11.6", features = [] }
tauri-plugin-shell = "2.3.6"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"

