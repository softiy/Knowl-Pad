# MSRV 感知解析：让 cargo 自动挑选与 rust-version 兼容的依赖版本。
# 背景：本项目 rust-version = 1.90（Tauri 2.12 家族要求 rustc 1.90）。
# 没有这个设置时，cargo 会按「最新可用」解析——若某天 Tauri 再抬高 MSRV，
# 解析结果会超出已固定 toolchain 的能力，CI（固定 1.90）会在 check 计划阶段直接失败。
# 对应 Cargo 1.84 起稳定的 resolver.incompatible-rust-versions（详见技术方案 §3.6.1）。
[resolver]
incompatible-rust-versions = "fallback"
