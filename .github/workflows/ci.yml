name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '24.19.0'
  RUST_TOOLCHAIN: '1.90.0'
  CARGO_TERM_COLOR: always
  # 门禁 10 的基线**按环境隔离**（DEBT-31 / #160 后续）：CI 用钉死的环境名读 `envs[ci-ubuntu-2vcpu]`，
  # 不随 runner 规格（CPU 数）漂移；该环境没有基线时门禁 exit 2 并打印建立方式（绝不跨环境比较）。
  KP_PERF_ENV: ci-ubuntu-2vcpu

jobs:
  gates:
    name: 17 项门禁（与本地同一脚本）
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }

      - name: 系统依赖（Tauri Linux 构建 + 门禁脚本的 ripgrep）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev ripgrep

      - name: 门禁工具（均不在 rustup components 中）
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-llvm-cov --locked

      - name: 校验工作流（actionlint，官方安装脚本）
        run: |
          bash <(curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

      - run: pnpm install --frozen-lockfile

      # 单一真相源：本地与 CI 跑同一个脚本，避免两套门禁漂移
      - name: 运行全部门禁
        run: node scripts/run-gates.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-report
          path: gate-report.json

      # 门禁 10 的**只读**产出：本次测量（含"缺该环境基线"的情况）。`if: always()` 保证门禁红时也能拿到数字；
      # 人工下载后把 `baseline.envs` 下的这一块贴进 .perf-baseline.json 并提交（门禁**不会**自动更新基线）。
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-baseline
          path: artifacts/perf-baseline.json

  windows-gates:
    name: Windows 冒烟（构建 + 单元测试）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}' }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: choco install ripgrep -y --no-progress
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: cargo test --workspace --locked
