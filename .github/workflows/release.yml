name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      gitee_only_tag:
        description: '补偿入口：只把某个已发布的 tag 同步到 Gitee（留空则走正常发布）'
        required: false
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: '24.19.0'
  RUST_TOOLCHAIN: '1.90.0'

jobs:
  build:
    name: 构建并发布（${{ matrix.platform }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows-latest, target: x86_64-pc-windows-msvc }
          - { platform: ubuntu-22.04,   target: x86_64-unknown-linux-gnu }
          - { platform: macos-latest,   target: aarch64-apple-darwin }
          - { platform: macos-15-intel, target: x86_64-apple-darwin }
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.4.2 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: pnpm }
      - uses: dtolnay/rust-toolchain@stable
        with: { toolchain: '${{ env.RUST_TOOLCHAIN }}' }
      - name: Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: 记录版本号（package.json 为准，四处已同步）
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: 构建安装包（签名产物 .sig 由 tauri 生成）
        run: pnpm tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: 生成 latest.json（updater 元数据）
        shell: bash
        run: node scripts/gen-latest-json.mjs --target ${{ matrix.target }} --version ${{ steps.ver.outputs.version }}
      - name: 上传构建产物（供后续 job 使用）
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            latest.json
          if-no-files-found: error

  publish:
    name: 发布到 GitHub Release 并同步 Gitee
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: 汇总 updater 元数据（合并各平台条目）
        run: node scripts/merge-latest-json.mjs --dir artifacts --out latest.json
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --notes-file CHANGELOG.md artifacts/*
      # ⬇︎ 替换 semantic-release-gitee（已停更逾 4 年，违反红线 R-16）
      # 口径（2026-10-13，见技术方案 §11.5）：**GitHub Release 是关键路径**；
      # Gitee 同步降级为 **best-effort** —— 未配置凭据时跳过、失败不阻断发布，但必须显式留痕，
      # 并提供补偿入口（workflow_dispatch 的 gitee_only_tag）。
      - name: Gitee 同步前置检查（未配置凭据则跳过）
        id: gitee_preflight
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -n "$GITEE_TOKEN" ] && [ -n "$GITEE_OWNER" ] && [ -n "$GITEE_REPO" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Gitee 凭据已配置，将执行同步。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "### ⏭️ Gitee 同步已跳过：未配置 GITEE_TOKEN / GITEE_OWNER / GITEE_REPO" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Gitee 同步跳过::缺少 GITEE_TOKEN/GITEE_OWNER/GITEE_REPO，本次仅发布 GitHub Release（可用 gitee_only_tag 补偿）"
          fi
      - name: 同步到 Gitee Release（best-effort；失败不阻断发布）
        id: gitee_sync
        if: steps.gitee_preflight.outputs.enabled == 'true'
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          for attempt in 1 2 3; do
            echo "::group::Gitee 同步尝试 $attempt/3"
            if node scripts/publish-gitee-release.mjs \
                 --tag "${{ github.ref_name }}" \
                 --name "${{ github.ref_name }}" \
                 --notes-file CHANGELOG.md \
                 --assets "artifacts/**/*"; then
              echo "::endgroup::"
              echo "### ✅ Gitee 同步成功（tag ${{ github.ref_name }}）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "::endgroup::"
            sleep $((attempt * 20))
          done
          {
            echo "### ⚠️ Gitee 同步失败（已重试 3 次；**不影响 GitHub Release**）"
            echo ""
            echo "补偿入口：Actions → Release → Run workflow，在 gitee_only_tag 输入框填 ${{ github.ref_name }}（不要用反引号包裹：shell 会当作命令替换）。"
            echo "脚本幂等：Release 已存在则复用、附件已存在则跳过，可安全重跑。"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Gitee 同步失败::GitHub Release 已发布；Gitee 侧需补偿（见本 job 摘要）"
          exit 1

  gitee-compensate:
    name: 补偿同步 Gitee（只走 Gitee，不动 GitHub Release）
    if: github.event_name == 'workflow_dispatch' && inputs.gitee_only_tag != ''
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: 下载该 tag 的 GitHub Release 资产（作为待同步文件）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts
          gh release download "${{ inputs.gitee_only_tag }}" --dir artifacts || true
          find artifacts -maxdepth 1 -type f -print | head -20
      - name: 同步到 Gitee（幂等，可安全重跑）
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
        run: |
          if [ -z "$GITEE_TOKEN" ] || [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_REPO" ]; then
            echo "::error title=缺少 Gitee 凭据::补偿入口需要 GITEE_TOKEN/GITEE_OWNER/GITEE_REPO"
            exit 1
          fi
          node scripts/publish-gitee-release.mjs \
            --tag "${{ inputs.gitee_only_tag }}" \
            --name "${{ inputs.gitee_only_tag }}" \
            --notes-file CHANGELOG.md \
            --assets "artifacts/**/*"
